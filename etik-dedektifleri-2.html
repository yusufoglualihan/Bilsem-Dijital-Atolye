/* ================= DURUM VE YARDIMCILAR ================= */
const KEY="bilgetik-etik-dedektifleri-v1",app=document.getElementById("app");
const dflt=()=>({mode:"bireysel",done:[],solved:{},txt:{},sel:{}});
let S=(()=>{try{return Object.assign(dflt(),JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){return dflt()}})();
let V="start",CH=0;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
// Seçenek sırası her açılışta karışır; böylece cevap harfi ezberlenemez
C.forEach(c=>c.tasks.forEach(t=>{if(t.t=="mc"){t.ord=t.o.map((_,i)=>i).sort(()=>Math.random()-.5)}}));
const seals=()=>`<div class=seals>${C.map((c,i)=>`<div class="seal${S.done.includes(i)?"":" off"}"><span aria-hidden=true>${c.si}</span>${S.done.includes(i)?"✔ ":"🔒 "}${c.seal}</div>`).join("")}</div>`;
const prog=()=>{const p=S.done.length*20;return `<div class=bar role=progressbar aria-valuemin=0 aria-valuemax=100 aria-valuenow=${p} aria-label="İlerleme"><i style="width:${p}%"></i></div><p class=mut>${S.done.length}/5 mühür kazanıldı</p>`};
function go(v,ch,focus){V=v;if(ch!==undefined)CH=ch;render(focus||"h1,h2");window.scrollTo(0,0)}

/* ================= EKRANLAR ================= */
function render(focus){
 app.innerHTML=({start,map,chapter,sealScr,final})[V]();
 const f=focus&&document.querySelector(focus);if(f){f.setAttribute("tabindex","-1");f.focus({preventScroll:focus.startsWith("#fb")?false:true})}
}
function start(){const has=S.done.length>0||Object.keys(S.solved).length>0;
 return `<div class=card><div class=hero aria-hidden=true>🕵️</div><h1>Bilgetik Etik Dedektifleri</h1><p class=tag>Yapay Zekânın Gizemli Dosyaları</p>
 <p><b>Yıl 2030.</b> Bir okulda kullanılan yapay zekâ sistemi bazı yanlış bilgiler üretmeye, kişisel verilerle ilgili riskler oluşturmaya ve adaletsiz değerlendirmelere yol açmaya başlamıştır.</p>
 <p>Okulun yapay zekâ etik danışmanı <b>Bilgetik</b>, bu sorunları araştırmak için öğrenci dedektiflerden oluşan bir ekip kurar.</p>
 <p>Göreviniz beş gizemli dosyayı çözmek, etik sorunları tespit etmek ve okulun güvenli yapay zekâ kullanım protokolünü hazırlamaktır.</p>
 <blockquote>Unutmayın: Bir cevabın doğru görünmesi, onun doğru olduğunu kanıtlamaz!</blockquote>
 <h2 style="font-size:1.1em">Nasıl oynayacaksınız?</h2><div class=seg role=group aria-label="Oyun türü">
 <button class=opt aria-pressed=${S.mode=="bireysel"} onclick="setMode('bireysel')">👤 Bireysel Oyun</button>
 <button class=opt aria-pressed=${S.mode=="grup"} onclick="setMode('grup')">👥 Grup Oyunu</button></div>
 <p class=mut>🔒 Gizlilik: Ad, e-posta gibi bilgi istenmez. Hiçbir veri sunucuya gönderilmez. İlerlemen ve yazdığın cevaplar yalnızca bu tarayıcıda (yerel depolama) saklanır.</p>
 <button class="btn gold" onclick="go('map')">${has?"Dedektiflik Görevine Başla (yeni oturum)":"Dedektiflik Görevine Başla"}</button>
 ${has?`<button class=btn onclick="go('map')">Oyuna Devam Et</button><button class=ghost onclick="restart()">Oyunu Yeniden Başlat</button>`:""}</div>`}
function setMode(m){S.mode=m;save();render()}
function map(){const n=S.done.length;
 return `<h1>Görev Haritası</h1><p>${S.mode=="grup"?"👥 Grup oyunu: kararları birlikte verin.":"👤 Bireysel oyun"}</p>${prog()}
 <div class=map>${C.map((c,i)=>{const st=S.done.includes(i)?"done":i==n?"open":"lock";
 return `<button class="file ${st}" ${st=="lock"?"disabled":""} onclick="go('chapter',${i})" aria-label="Dosya ${i+1}: ${c.title}. ${st=="done"?"Tamamlandı":st=="open"?"Açık":"Kilitli"}">
 <span aria-hidden=true style="font-size:34px">${st=="lock"?"🔒":c.icon}</span><b>Dosya ${i+1}: ${c.title}</b><span class=mut>${c.theme}</span><br><span class=lbl>${st=="done"?"✔ Tamamlandı":st=="open"?"▶ Açık — başla":"🔒 Kilitli"}</span></button>`}).join("")}</div>
 <h2 style="font-size:1.2em;margin-top:22px">Mühürlerin</h2>${seals()}
 <button class=ghost onclick="go('start')">← Başlangıç</button><button class=ghost onclick="dl()">⬇ Cevaplarımı İndir (.txt)</button><button class=ghost onclick="restart()">Oyunu Yeniden Başlat</button>`}
function chapter(){const c=C[CH];
 let h=`<button class=ghost onclick="go('map')">← Görev Haritası</button><article class=card><p class=tag>${c.icon} Dosya ${CH+1}/5 · Etik tema: ${c.theme}</p><h2>${c.title}</h2>
 ${c.note?`<p class=note>${c.note}</p>`:""}<p>${c.story}</p>${c.quote?`<blockquote>${c.quote}</blockquote>`:""}${c.after?`<p>${c.after}</p>`:""}</article>`;
 let open=true;
 c.tasks.forEach((t,i)=>{if(!open)return;h+=task(t,CH,i);if(!S.solved[CH+"-"+i])open=false});
 if(open)h+=`<div class=card><p>🎉 Bu dosyadaki tüm görevleri tamamladın!</p><button class="btn gold" onclick="finish()">${c.si} Mührü Kazan</button></div>`;
 return h}
function task(t,ch,n){const k=ch+"-"+n,ok=S.solved[k];
 let h=`<section class=card aria-labelledby="q${k}"><p class=tag>Görev ${n+1}</p><h3 id="q${k}">${t.q}</h3>`;
 if(S.mode=="grup"&&!ok)h+=`<p class=mut>👥 Önce tartışın, sonra ortak kararınızı verin.</p>`;
 if(t.t=="mc")h+=`<div class=opts role=group aria-labelledby="q${k}">`+t.ord.map((oi,p)=>{const g=ok&&oi==t.c;
  return `<button class="opt${g?" good":""}" id="o${k}-${oi}" ${ok?"disabled":""} onclick="pick(${ch},${n},${oi})"><b>${"ABCD"[p]})</b> ${t.o[oi]}${g?` <span class=lbl>✔ Doğru</span>`:""}</button>`}).join("")+`</div>`;
 else{
  if(t.t=="pick")h+=`<p class=mut>Tam üç ilke seç.</p>`+t.o.map((o,i)=>`<label class=chk><input type=checkbox ${(S.sel[k]||[]).includes(i)?"checked":""} onchange="chk('${k}',${i},this.checked)"> <span>${o}</span></label>`).join("");
  t.f.forEach((f,i)=>h+=`<label for="t${k}-${i}">${f}</label><textarea id="t${k}-${i}" rows=3 oninput="typ('${k}-${i}',this.value)">${esc(S.txt[k+"-"+i])}</textarea>`);
  h+=`<p class=mut>✍️ Yazdıkların yalnızca bu tarayıcıda saklanır; doğru/yanlış diye değerlendirilmez.</p><button class=btn onclick="saveT(${ch},${n})">${ok?"Kararını Güncelle":"Kararını Kaydet"}</button>`}
 h+=`<div class=fb id="fb${k}" aria-live=polite tabindex=-1>${ok?(t.t=="mc"?`✅ <b>Doğru!</b> ${t.ok}`:`✅ <b>Kaydedildi.</b> Cevabın korunuyor; istersen düzenleyebilirsin.`):""}</div>`;
 return h+(t.hint&&!ok?`<details><summary>💡 Bilgetik’in ipucu</summary>${t.hint}</details>`:"")+`</section>`}
function pick(ch,n,oi){const t=C[ch].tasks[n],k=ch+"-"+n,fb=document.getElementById("fb"+k),b=document.getElementById("o"+k+"-"+oi);
 if(oi==t.c){S.solved[k]=1;save();render("#fb"+k);return}
 b.classList.add("bad");if(!b.querySelector(".lbl"))b.insertAdjacentHTML("beforeend",` <span class=lbl>✖ Bu seçim uygun değil</span>`);
 fb.innerHTML=`💭 <b>Henüz değil, tekrar dene.</b> ${t.no}`}
function typ(id,v){S.txt[id]=v;save()}
function chk(k,i,on){const a=new Set(S.sel[k]||[]);on?a.add(i):a.delete(i);S.sel[k]=[...a];save()}
function saveT(ch,n){const t=C[ch].tasks[n],k=ch+"-"+n,fb=document.getElementById("fb"+k);let m="";
 if(t.t=="pick"){const s=S.sel[k]||[];
  if(s.length!=3)m="Tam üç ilke seçmelisin.";else if(s.includes(t.bad))m="💭 "+t.no}
 if(!m&&t.f.some((_,i)=>(S.txt[k+"-"+i]||"").trim().length<8))m="Devam etmek için gerekçeni birkaç cümleyle yaz (her alan en az 8 karakter).";
 if(m){fb.textContent=m;fb.focus();return}
 S.solved[k]=1;save();render("#fb"+k)}
function finish(){if(!S.done.includes(CH)){S.done.push(CH);S.done.sort();save()}go("sealScr")}
function sealScr(){const c=C[CH],last=S.done.length==5;
 return `<div class=card style="text-align:center"><div class=big aria-hidden=true>${c.si}</div><h2>${c.seal} kazanıldı!</h2>
 <p><b>Dedektif notu:</b> ${c.take}</p><p class=mut>Protokol maddesi: ${c.rule}</p>${seals()}
 ${last?`<button class="btn gold" onclick="go('final')">🏅 Finale Git</button>`:`<button class="btn gold" onclick="go('chapter',${CH+1})">Sonraki Dosyaya Geç</button>`}
 <button class=ghost onclick="go('map')">Görev Haritası</button></div>`}
function final(){return `<div class=card style="text-align:center"><div class=big aria-hidden=true>🏆</div><h1>Tebrikler, Bilgetik Etik Dedektifleri!</h1></div>
 <div class=card><p>Beş gizemli dosyayı tamamladınız. Yapay zekâdan gelen bilgileri sorgulamanın, kişisel verileri korumanın, adalet risklerini fark etmenin ve etik kararlar vermenin önemini öğrendiniz.</p>
 <p>Unutmayın: Yapay zekâyı sorumlu kullanmak, yalnızca doğru aracı seçmek değil; sonuçları değerlendirmek ve kendi kararlarımızın sorumluluğunu üstlenmektir.</p>${seals()}</div>
 <div class=card><h2>📜 Okulun Güvenli Yapay Zekâ Protokolü</h2><p class=mut>Dedektif ekibinin beş dosyadan çıkardığı maddeler:</p><ol class=rules>${C.map(c=>`<li>${c.rule}</li>`).join("")}</ol></div>
 <div class=noprint><button class="btn gold" onclick="restart()">Tekrar Oyna</button><button class=btn onclick="window.print()">🖨 Protokolü Yazdır</button><button class=ghost onclick="dl()">⬇ Cevaplarımı İndir</button><button class=ghost onclick="go('map')">Görev Haritası</button></div>`}

/* ================= YENİDEN BAŞLAT / İNDİR ================= */
function restart(){if(!confirm("Tüm ilerlemen ve yazdığın cevaplar silinecek. Yeniden başlamak istiyor musun?"))return;
 try{localStorage.removeItem(KEY)}catch(e){}S=dflt();go("start")}
function dl(){let o="Bilgetik Etik Dedektifleri — Yazılı Cevaplar\nOyun türü: "+S.mode+"\n\n";
 C.forEach((c,ci)=>c.tasks.forEach((t,ti)=>{if(t.t=="mc")return;o+=`[${c.title} / Görev ${ti+1}] ${t.q}\n`;
  if(t.t=="pick")o+="Seçilen ilkeler: "+(S.sel[ci+"-"+ti]||[]).map(i=>t.o[i]).join("; ")+"\n";
  t.f.forEach((f,fi)=>o+=f+": "+(S.txt[ci+"-"+ti+"-"+fi]||"(boş)")+"\n");o+="\n"}));
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([o],{type:"text/plain;charset=utf-8"}));a.download="bilgetik-cevaplarim.txt";document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href)},1500)}
try{render()}catch(e){showErr(e&&e.message)}
</script>
</body>
</html>
